<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satish Law Agency - Legal Research</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Load Supabase JS Client via CDN for GitHub Pages -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar (Simplified for brevity) -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
            <div class="p-5 border-b border-slate-700">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-balance-scale"></i> Satish Law
                </h1>
            </div>
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <a href="#" class="block p-3 bg-blue-600 rounded-lg"><i class="fas fa-search w-6"></i> Search</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden relative">
            <!-- Header -->
            <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center z-10 shadow-sm">
                <div class="flex-1 max-w-3xl flex gap-2">
                    <div class="relative w-full">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Search judgments, acts, citations..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
                    </div>
                    <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg text-white font-medium shadow-sm transition">
                        Search
                    </button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="flex-1 overflow-y-auto p-6">
                <div id="loadingIndicator" class="hidden text-center py-10">
                    <i class="fas fa-circle-notch fa-spin text-3xl text-blue-500"></i>
                    <p class="mt-2 text-gray-500">Searching legal database...</p>
                </div>

                <h3 class="text-xl font-bold mb-4 text-gray-800" id="resultsTitle">Search Results</h3>
                <div id="resultsContainer" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-8 text-center text-gray-500">
                        Enter a query above to search through the judgments database.
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- External App Logic -->
    <script src="app.js"></script>
</body>
</html>
